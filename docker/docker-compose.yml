version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: ai-interview-postgres

    restart: always

    environment:
      POSTGRES_DB: ai_interview

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: ai-interview-redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres-data: