spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ai_interview}
    username: ${DB_USERNAME:ai_interview_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
server:
    port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:c3ByaW5nLWJvb3QtYWktaW50ZXJ2aWV3LWNvYWNoLXBvcnRmb2xpby1zZWNyZXQta2V5LTMyei1ieXRlcy1sZW5ndGg=}
  expiration: 1800000 # 30 minutes (30 * 60 * 1000 ms)
  refresh-expiration: 1209600000 # 14 days (14 * 24 * 60 * 60 * 1000 ms)

ai:
  provider: ${AI_PROVIDER:groq}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  rate-limit:
    max-retries: ${AI_RATE_LIMIT_MAX_RETRIES:2}
    initial-backoff-millis: ${AI_RATE_LIMIT_INITIAL_BACKOFF_MILLIS:1000}
    max-backoff-millis: ${AI_RATE_LIMIT_MAX_BACKOFF_MILLIS:60000}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}

resume:
  max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:5242880}
