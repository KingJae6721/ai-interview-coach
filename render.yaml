services:
  - type: web
    name: ai-interview-coach-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MAX_POOL_SIZE
        value: "5"
      - key: REDIS_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "1800000"
      - key: JWT_REFRESH_EXPIRATION
        value: "1209600000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRINGDOC_ENABLED
        value: "false"
